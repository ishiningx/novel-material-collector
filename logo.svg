<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 - 青瓷蓝渐变色 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A7D8E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5F6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F4F8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- 书本主体 -->
  <g transform="translate(130, 110)">
    <!-- 书脊 -->
    <rect x="0" y="20" width="26" height="260" fill="#D1E9EF" rx="3"/>
    
    <!-- 书页（左页） -->
    <rect x="26" y="20" width="112" height="260" fill="url(#bookGrad)" rx="3"/>
    
    <!-- 书页（右页） -->
    <rect x="138" y="20" width="112" height="260" fill="url(#bookGrad)" rx="3"/>
    
    <!-- 书本装饰线 -->
    <line x1="42" y1="50" x2="125" y2="50" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="42" y1="80" x2="118" y2="80" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="42" y1="110" x2="122" y2="110" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- 收藏星标（表示素材收集） -->
    <g transform="translate(195, 150)">
      <polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,14 -18,24 -12,4 -28,-9 -8,-9" fill="#D97706" opacity="0.9"/>
    </g>
    
    <!-- 书签 -->
    <polygon points="225,20 225,80 240,60 255,80 255,20" fill="#D97706"/>
  </g>
  
  <!-- 底部装饰光晕 -->
  <ellipse cx="256" cy="440" rx="80" ry="12" fill="rgba(0,0,0,0.06)"/>
</svg>